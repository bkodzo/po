name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test the Go code
        run: |
          go vet ./...
          go test ./...
      - name: Build the desktop window and check its rules
        run: |
          swift build -c release --package-path desktop
          "$(swift build -c release --package-path desktop --show-bin-path)/po-window" --selftest
